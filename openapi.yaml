info:
  description: 'API de AztecApp Explorer.


    **El sobre.** Todas las respuestas viajan envueltas: `{"success": true, "data":
    {...}}`

    en el camino feliz y `{"success": false, "error": "...", "details": {...}}` cuando
    algo

    falla. El cliente debe desenvolver `data`.


    **Acceso.** El producto vende un DESBLOQUEO ÚNICO de 15 USD que no caduca; no
    hay

    niveles ni suscripción. Los endpoints públicos aceptan token opcional: sin él
    —o con

    uno revocado— responden 200 con el contenido en versión teaser, no 401. Eso es

    deliberado: la app tiene que poder pintar el candado.


    **Qué se paga y qué no.** La logística de cada sitio (tarifa de taquilla, horarios,

    cómo llegar, avisos de seguridad) viaja SIEMPRE: son datos del mundo real y esconderlos

    solo manda al viajero a buscarlos fuera. Lo que va detrás del desbloqueo es lo
    que

    escribimos nosotros: descripciones, `whyVisit`, contexto histórico y el audio
    de los

    tours.


    **Idioma.** `Accept-Language` se compara por prefijo de dos letras (`es-MX` →
    `es`).

    El idioma base es el inglés y vive en las columnas del modelo; el español entra
    por la

    tabla de traducciones. Si una cuenta tiene `preferredLocale`, manda sobre la cabecera.'
  title: AztecApp Explorer API
  version: 1.0.0
servers:
- url: http://localhost:5001
  description: Backend local
- url: http://localhost:4010
  description: Mock de Prism
tags:
- name: users
  description: Cuentas, sesión y perfil.
- name: places
  description: 'Sitios: Explore, Near y Saved.'
- name: tours
  description: Recorridos autoguiados y su avance.
- name: historical
  description: Guía histórica y overlay del lago.
- name: payments
  description: El desbloqueo único.
paths:
  /api/users/register:
    post:
      tags:
      - users
      summary: Crear una cuenta
      description: Cuenta completa con contraseña. Devuelve la pareja de tokens ya
        lista, sin obligar a un login extra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Email inválido o contraseña de menos de 8 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/login:
    post:
      tags:
      - users
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas o cuenta desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/refresh:
    post:
      tags:
      - users
      summary: Renovar el access token
      description: Requiere el REFRESH token en la cabecera. Un access token aquí
        responde 401.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Token nuevo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Falta el refresh token, o se mandó un access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/logout:
    post:
      tags:
      - users
      summary: Cerrar sesión
      description: 'Mete el jti en la blocklist: el token deja de valer al instante,
        no cuando caduque.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/profile:
    get:
      tags:
      - users
      summary: Perfil de la cuenta
      security: &id001
      - bearerAuth: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Sin token o token revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cuenta desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - users
      summary: Editar el perfil
      description: Lista blanca estricta. Un campo fuera de ella devuelve 400 en vez
        de ignorarse en silencio.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Campo no editable o valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/location-permission:
    post:
      tags:
      - users
      summary: Registrar la respuesta al permiso de ubicación
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPermissionRequest'
      responses:
        '200':
          description: Registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/places/:
    get:
      tags:
      - places
      summary: Listado de sitios (pestaña Explore)
      description: 'Token opcional: sin él la respuesta llega en versión teaser, con
        200. Con sesión, cada sitio trae `isSaved` resuelto en la misma consulta.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 100
      - name: curation
        in: query
        schema:
          type: string
          enum:
          - must_see
          - quick_stop
        description: Filtros de la barra de Explore. Un valor desconocido se ignora.
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Sitios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
  /api/places/nearby:
    get:
      tags:
      - places
      summary: Sitios cercanos, con distancia
      description: 'Ordenados por cercanía con ST_DWithin y ST_Distance. La distancia
        llega calculada en `location.distanceKm`: no la recalcules en el cliente.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: radius
        in: query
        schema:
          type: number
          default: 5
        description: Kilómetros.
      - name: curation
        in: query
        schema:
          type: string
          enum:
          - must_see
          - quick_stop
        description: Filtros de la barra de Explore. Un valor desconocido se ignora.
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Sitios cercanos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
        '400':
          description: Faltan latitude o longitude
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/places/recommended:
    get:
      tags:
      - places
      summary: Sitios recomendados alrededor
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Recomendados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
        '400':
          description: Faltan coordenadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/places/saved:
    get:
      tags:
      - places
      summary: Sitios guardados (pestaña Saved)
      security:
      - bearerAuth: []
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Guardados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/places/{place_id}:
    get:
      tags:
      - places
      summary: Ficha de un sitio
      description: 'Bloqueada: llegan metadata y logística, no el contenido. Desbloqueada:
        llega todo.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/places/{place_id}/save:
    post:
      tags:
      - places
      summary: Guardar un sitio
      description: 'Idempotente: guardarlo dos veces no duplica nada.'
      security: &id002
      - bearerAuth: []
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - places
      summary: Quitar un sitio de guardados
      security: *id002
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Quitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No estaba guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tours/:
    get:
      tags:
      - tours
      summary: Listado de tours
      description: 'Los bloqueados salen como teaser en vez de desaparecer: si no,
        nadie llega a ver qué ofrece pagar.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 100
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Tours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourListResponse'
  /api/tours/free:
    get:
      tags:
      - tours
      summary: Tours gratuitos
      responses:
        '200':
          description: Tours gratuitos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourListResponse'
  /api/tours/user/tours:
    get:
      tags:
      - tours
      summary: Mis tours, con su avance
      security:
      - bearerAuth: []
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Tours empezados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTourListResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tours/{tour_id}:
    get:
      tags:
      - tours
      summary: Ficha de un tour
      description: '`stops` solo viaja con el desbloqueo. El teaser conserva `stopsCount`
        e `includesAudio` para pintar el candado.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: tour_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Ficha del tour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourResponse'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tours/{tour_id}/start:
    post:
      tags:
      - tours
      summary: Empezar un tour
      description: 403 si el tour es de pago y la cuenta no tiene el desbloqueo. Repetirlo
        devuelve el progreso existente.
      security:
      - bearerAuth: []
      parameters:
      - name: tour_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Tour iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourProgressResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Hace falta el desbloqueo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tours/{tour_id}/progress:
    put:
      tags:
      - tours
      summary: Reportar avance
      description: '`isCompleted` NO se acepta aquí: cerrar un tour pasa por /complete.
        Mandarlo devuelve 400.


        Devuelve el avance COMPLETO tal como quedó guardado, no solo un id: el cliente
        lee el estado del servidor en vez de fiarse del que acaba de mandar.'
      security:
      - bearerAuth: []
      parameters:
      - name: tour_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourProgressUpdateRequest'
      responses:
        '200':
          description: Avance guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourProgressResponse'
        '400':
          description: Campo no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El tour no está empezado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tours/{tour_id}/complete:
    post:
      tags:
      - tours
      summary: Cerrar un tour
      description: Mueve los contadores del perfil y del propio tour.
      security:
      - bearerAuth: []
      parameters:
      - name: tour_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourCompleteRequest'
      responses:
        '200':
          description: Tour cerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourProgressResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El tour no está empezado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/historical/chronology:
    get:
      tags:
      - historical
      summary: Cronología, en orden
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: timelineId
        in: query
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Artículos ordenados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
  /api/historical/topics:
    get:
      tags:
      - historical
      summary: Temas con su número de artículos
      responses:
        '200':
          description: Temas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
  /api/historical/content:
    get:
      tags:
      - historical
      summary: Todos los artículos
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: contentType
        in: query
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Artículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
  /api/historical/content/topic:
    get:
      tags:
      - historical
      summary: Artículos de un tema
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: topic
        in: query
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Artículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
        '400':
          description: Falta el tema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/historical/content/era:
    get:
      tags:
      - historical
      summary: Artículos de una época
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: era
        in: query
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Artículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
        '400':
          description: Falta la época
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/historical/content/place/{place_id}:
    get:
      tags:
      - historical
      summary: Artículos ligados a un sitio
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Artículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
  /api/historical/content/{content_id}:
    get:
      tags:
      - historical
      summary: Un artículo
      description: 'Sin el desbloqueo llega la ficha sin cuerpo: título, de qué va
        y cuánto se tarda, pero no el texto. `nextContentId` alimenta el botón Next.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          example: es-MX
        description: 'Se compara por prefijo de dos letras. Soportados: en, es.'
      responses:
        '200':
          description: Artículo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalContentResponse'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/historical/content/{content_id}/read:
    post:
      tags:
      - historical
      summary: Marcar como leído
      security: &id003
      - bearerAuth: []
      parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Marcado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - historical
      summary: Desmarcar
      security: *id003
      parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Desmarcado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No estaba marcado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/historical/timelines:
    get:
      tags:
      - historical
      summary: Cronologías disponibles
      responses:
        '200':
          description: Cronologías
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineListResponse'
  /api/historical/lake-view:
    get:
      tags:
      - historical
      summary: Overlay del lago de Tenochtitlan
      description: 'FeatureCollection GeoJSON, lista para pintar sin transformarla.


        Los Features llegan en ORDEN DE PINTADO: primero el agua, encima la tierra.
        Cada uno declara su `surfaceType` (`water` o `land`), que es lo que decide
        el color — no lo deduzcas del nombre.


        `year=2026` devuelve la colección VACÍA a propósito: el diseño enseña el mapa
        de Google sin capa, y el overlay es lo que se añade al pasar a 1500.'
      parameters:
      - name: year
        in: query
        schema:
          type: integer
          enum:
          - 1500
          - 2026
        description: El conmutador del mapa.
      - name: bbox
        in: query
        schema:
          type: string
        example: -99.2,19.3,-99.0,19.5
        description: 'minLon,minLat,maxLon,maxLat. Recorta con ST_Intersects: un polígono
          que entra por una esquina también se devuelve.'
      responses:
        '200':
          description: Overlay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LakeOverlayResponse'
        '400':
          description: bbox mal formado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/payments/access:
    get:
      tags:
      - payments
      summary: ¿Tiene esta cuenta el desbloqueo?
      description: Lo que la app consulta al abrir para saber si pinta candados.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado de acceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessStateResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/payments/purchases:
    get:
      tags:
      - payments
      summary: Historial de compras
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Compras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseListResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/payments/checkout:
    post:
      tags:
      - payments
      summary: Abrir una compra
      description: 'Devuelve la compra pendiente para arrancar el pago. Llamarlo dos
        veces devuelve la MISMA, no crea otra. 409 si la cuenta ya tiene el desbloqueo:
        no caduca, así que una segunda compra siempre es un error.'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Compra abierta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La cuenta ya tiene acceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/payments/confirm:
    post:
      tags:
      - payments
      summary: Confirmar el cobro y conceder el acceso
      description: 'Idempotente por (provider, externalId): un webhook repetido encuentra
        la compra en vez de duplicarla.


        **501 mientras la pasarela no esté implementada.** Aceptar un recibo sin comprobarlo
        contra el proveedor sería regalar el contenido a cualquiera que mande una
        petición inventada.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseConfirmRequest'
      responses:
        '200':
          description: Acceso concedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Cuerpo inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: El proveedor todavía no verifica cobros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
openapi: 3.0.3
